<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -90 5711 1614"
     role="img" aria-label="itarin">
  <title>itarin</title>
  <style>
    .letter, .dot {
      transform-box: fill-box;
      transform-origin: center;
    }
    .letter {
      fill: #eef2f7;
      animation: rise 0.68s cubic-bezier(0.16, 1, 0.32, 1) both;
      animation-delay: calc(var(--i) * 75ms);
    }
    .dot {
      fill: #7fd6ee;
      animation:
        lock 0.55s cubic-bezier(0.18, 1.15, 0.32, 1) both,
        glow 2.6s ease-in-out infinite;
      animation-delay: calc(0.92s + var(--i) * 90ms), 1.45s;
      filter: drop-shadow(0 0 420px #7fd6ee);
    }
    @keyframes rise {
      from { transform: translateY(-42%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    @keyframes lock {
      0%   { transform: translateY(38%) scale(0.15); opacity: 0; }
      72%  { transform: translateY(-6%) scale(1.12); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 320px #7fd6ee); }
      50%      { filter: drop-shadow(0 0 780px #7fd6ee); }
    }
    @media (prefers-reduced-motion: reduce) {
      .letter, .dot { animation: none; opacity: 1; transform: none; }
      .dot { filter: drop-shadow(0 0 420px #7fd6ee); }
    }
  </style>
  <defs>
    <clipPath id="rise-clip">
      <rect x="-40" y="-90" width="5711" height="1524"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rise-clip)">
